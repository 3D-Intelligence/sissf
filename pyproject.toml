[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sissf"
version = "0.1.0"
description = "Spatial Intelligence Scene State Format - A platform-agnostic, human and machine readable 3D scene representation standard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Spatial Intelligence", email = "noreply@example.com"}
]
keywords = ["3d", "scene", "representation", "holodeck", "objaverse", "ai2thor", "scene-state"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
viz = [
    "trimesh>=4.0.0",
]
examples = [
    "trimesh>=4.0.0",
    "jupyter>=1.0.0",
]
all = [
    "sissf[viz,examples]",
]

[project.urls]
Homepage = "https://github.com/spatialintelligence/sissf"
Repository = "https://github.com/spatialintelligence/sissf"
Documentation = "https://github.com/spatialintelligence/sissf/tree/main/docs"
Issues = "https://github.com/spatialintelligence/sissf/issues"

[tool.setuptools]
packages = ["sissf", "sissf.architecture", "sissf.geometry", "sissf.scene_state"]

[tool.setuptools.package-data]
sissf = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "trimesh.*",
]
ignore_missing_imports = true
